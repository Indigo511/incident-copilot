[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-copilot"
version = "0.2.0"
description = "An AI-assisted production incident investigation learning project"
requires-python = ">=3.11"

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
llm = ["openai>=1.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
all = [
  "sentence-transformers>=3.0",
  "openai>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
incident-copilot = "incident_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
